<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">How foldtint works</title>
  <desc id="desc">Three steps. 1: Lock a folder in Finder with Get Info, Locked. 2: The watcher gets a directory event on the Desktop. 3: foldtint adds the Locked Finder tag in the configured color.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1l7 4-7 4" fill="none" stroke="#a1a1a6" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="299" rx="24" fill="#ffffff" stroke="#e4e4e7"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <!-- 1. Lock -->
    <g transform="translate(64 40)">
      <rect x="0.5" y="0.5" width="319" height="219" rx="16" fill="#fafafa" stroke="#e4e4e7"/>
      <g transform="translate(32 40)">
        <rect x="0" y="0" width="28" height="28" rx="7" fill="#1d1d1f"/>
        <path d="M7 14.5l5 5 9-10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="44" y="21" font-size="22" fill="#1d1d1f">Locked</text>
      </g>
      <text x="32" y="148" font-size="26" font-weight="600" letter-spacing="-0.5" fill="#1d1d1f"><tspan fill="#AF52DE">1</tspan>  Lock a folder</text>
      <text x="32" y="184" font-size="20" fill="#55555a">Finder › Get Info › Locked</text>
    </g>

    <path d="M396 150h32" stroke="#a1a1a6" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- 2. Watch -->
    <g transform="translate(440 40)">
      <rect x="0.5" y="0.5" width="319" height="219" rx="16" fill="#fafafa" stroke="#e4e4e7"/>
      <g transform="translate(32 38)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
        <rect x="0" y="0" width="256" height="34" rx="9" fill="#1d1d1f"/>
        <circle cx="20" cy="17" r="5" fill="#34C759"/>
        <text x="36" y="23" font-size="18" fill="#ffffff">~/Desktop</text>
      </g>
      <text x="32" y="148" font-size="26" font-weight="600" letter-spacing="-0.5" fill="#1d1d1f"><tspan fill="#AF52DE">2</tspan>  The watcher sees it</text>
      <text x="32" y="184" font-size="20" fill="#55555a">Directory events, low memory</text>
    </g>

    <path d="M772 150h32" stroke="#a1a1a6" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- 3. Tag -->
    <g transform="translate(816 40)">
      <rect x="0.5" y="0.5" width="319" height="219" rx="16" fill="#fafafa" stroke="#e4e4e7"/>
      <g transform="translate(32 24) scale(0.82)">
        <rect x="6" y="0" width="32" height="16" rx="5" fill="#C178E5"/>
        <rect x="0" y="9" width="84" height="55" rx="7" fill="#C989E8" stroke="#D3A0ED"/>
      </g>
      <g transform="translate(120 44)">
        <rect x="0" y="0" width="100" height="30" rx="15" fill="#F2E3FA" stroke="#DDB6F1"/>
        <circle cx="20" cy="15" r="5" fill="#AF52DE"/>
        <text x="32" y="21" font-size="18" fill="#1d1d1f">Locked</text>
      </g>
      <text x="32" y="148" font-size="26" font-weight="600" letter-spacing="-0.5" fill="#1d1d1f"><tspan fill="#AF52DE">3</tspan>  The tag is set</text>
      <text x="32" y="184" font-size="20" fill="#55555a">Locked tag in your color</text>
    </g>
  </g>
</svg>

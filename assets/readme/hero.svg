<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">foldtint</title>
  <desc id="desc">foldtint tints locked top-level Desktop folders on macOS with a Finder tag color. Illustration: a Desktop window with two locked folders in purple, each with a Locked tag, and one unlocked folder in the default blue.</desc>

  <defs>
    <g id="lock">
      <path d="M37 34v-4.5a5 5 0 0 1 10 0V34" fill="none" stroke="#ffffff" stroke-width="2.6"/>
      <rect x="33.5" y="33" width="17" height="13" rx="3" fill="#ffffff"/>
    </g>
    <g id="folder-locked">
      <rect x="6" y="0" width="32" height="16" rx="5" fill="#C178E5"/>
      <rect x="0" y="9" width="84" height="55" rx="7" fill="#C989E8" stroke="#D3A0ED"/>
      <use href="#lock"/>
    </g>
    <g id="folder-open">
      <rect x="6" y="0" width="32" height="16" rx="5" fill="#9ECAF5"/>
      <rect x="0" y="9" width="84" height="55" rx="7" fill="#5AA6E8" stroke="#4F93CF"/>
    </g>
    <g id="tag">
      <rect x="-50" y="0" width="100" height="30" rx="15" fill="#F2E3FA" stroke="#DDB6F1"/>
      <circle cx="-30" cy="15" r="5" fill="#AF52DE"/>
      <text x="-18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#1d1d1f">Locked</text>
    </g>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="399" rx="24" fill="#ffffff" stroke="#e4e4e7"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <circle cx="70" cy="106" r="6" fill="#AF52DE"/>
    <text x="86" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6e6e73">macOS CLI · Finder tags</text>
    <text x="60" y="212" font-size="104" font-weight="700" letter-spacing="-4" fill="#1d1d1f">foldtint</text>
    <text x="64" y="268" font-size="34" font-weight="600" letter-spacing="-0.8" fill="#1d1d1f">Tint locked Desktop folders.</text>
    <text x="64" y="306" font-size="24" fill="#55555a">Unlocked folders keep the default color.</text>
    <text x="64" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6e6e73">macOS 14+  ·  Node.js 18+  ·  MIT</text>
  </g>

  <g id="desktop" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="664.5" y="48.5" width="471" height="262" rx="18" fill="#ffffff" stroke="#d0d0d4"/>
    <path d="M665 96h470" stroke="#e4e4e7"/>
    <circle cx="690" cy="72" r="6" fill="#d0d0d4"/>
    <circle cx="710" cy="72" r="6" fill="#d0d0d4"/>
    <circle cx="730" cy="72" r="6" fill="#d0d0d4"/>
    <text x="900" y="78" text-anchor="middle" font-size="18" font-weight="600" fill="#1d1d1f">Desktop</text>

    <g transform="translate(743 122)">
      <use href="#folder-locked"/>
      <text x="42" y="92" text-anchor="middle" font-size="20" fill="#1d1d1f">Taxes</text>
      <use href="#tag" transform="translate(42 106)"/>
    </g>
    <g transform="translate(858 122)">
      <use href="#folder-open"/>
      <text x="42" y="92" text-anchor="middle" font-size="20" fill="#1d1d1f">Photos</text>
    </g>
    <g transform="translate(973 122)">
      <use href="#folder-locked"/>
      <text x="42" y="92" text-anchor="middle" font-size="20" fill="#1d1d1f">Archive</text>
      <use href="#tag" transform="translate(42 106)"/>
    </g>
  </g>

  <g id="command" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">
    <rect x="664" y="326" width="472" height="46" rx="12" fill="#1d1d1f"/>
    <text x="688" y="356" fill="#a1a1a6">$</text>
    <text x="712" y="356" fill="#ffffff">foldtint on</text>
    <text x="1112" y="356" text-anchor="end" fill="#8e8e93"># watch ~/Desktop</text>
  </g>
</svg>
